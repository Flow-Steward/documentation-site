schema_version: platform.workflow_bundle.v2
kind: workflow_bundle
metadata:
  source_workflow_id: docs_deterministic_smoke_v2
workflows:
- workflow_id: docs_deterministic_smoke_v2
  version: 1.0.0
  display_name: Documentation Deterministic Smoke
  description: Turns one text input into one text output without models, tools, connectors, HTTP, extensions or child workflows.
  enabled: false
  trigger: {}
  settings:
    portability:
      import_state: draft
    callable:
      enabled: true
      input_mode: fields
      strict_inputs: true
      trigger_channels:
      - ui
      - api
      - mcp
      expected_inputs:
      - name: message
        type: string
        required: true
      expected_outputs:
      - name: greeting
        type: string
        required: true
  participants: []
  tags:
  - documentation
  - deterministic
  - provider-free
  steps:
  - step_id: greet
    step_kind: template
    display_name: Greet
    optional: false
    override:
      template:
        text: 'Hello, {{ message }}!'
        format: text
        inputs:
        - name: message
          source: state.inputs.message
          type: text
          required: true
        result_target: state.greeting
  - step_id: done
    step_kind: stop_success
    display_name: Done
    optional: false
    override:
      stop_success:
        message: Greeting produced.
  groups: []
  for_each: []
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: greet
    edges:
    - source:
        kind: step
        id: greet
      outcome:
        name: success
      target:
        kind: step
        id: done
      rework: false
dependencies: []
import_hints:
  default_enabled: false
  import_state: draft
  conflict_policy: rename_workflow
