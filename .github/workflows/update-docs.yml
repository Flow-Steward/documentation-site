name: Propose product documentation updates
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [product-docs-sync]
permissions:
  contents: read
concurrency:
  group: product-documentation-sync
  cancel-in-progress: false
jobs:
  prepare_cached_updates:
    # No full-site fallback, model action, manual dispatch, tests or builds.
    # Missing receipts/unknown impact produce a blocked report, never new calls.
    if: >-
      github.repository == 'Flow-Steward/documentation-site' &&
      ((github.event_name == 'repository_dispatch' && github.actor == vars.DOCS_SYNC_ACTOR) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.queue.outputs.publish }}
      persist_coverage: ${{ steps.queue.outputs.persist_coverage }}
      docs_sha: ${{ steps.queue.outputs.docs_sha }}
    steps:
      - name: Keep the configured model pinned to Luna
        env:
          DOCS_AI_MODEL: ${{ vars.DOCS_AI_MODEL }}
        run: |
          if [ "${DOCS_AI_MODEL:-}" != 'gpt-6-luna' ]; then
            echo '::error::DOCS_AI_MODEL must be exactly gpt-6-luna. No model will be invoked.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: docs-site
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Flow-Steward/flow-steward-app
          ref: ${{ github.event.client_payload.source_sha || 'main' }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Refresh public dependency topology without executing product code
        working-directory: docs-site
        run: python3 scripts/automation/review-deep-dependencies.py ../product "$RUNNER_TEMP/dependency-candidate.json"
      - name: Select affected pages and reuse validated receipts only
        id: queue
        working-directory: docs-site
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/run.mjs prepare-cache-only ../product "$RUNNER_TEMP/cached-docs-queue" "$RUNNER_TEMP/dependency-candidate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cached-documentation-queue
          path: |
            ${{ runner.temp }}/cached-docs-queue/
            ${{ runner.temp }}/dependency-candidate.json
          retention-days: 90
          if-no-files-found: error
  publish_cached_updates:
    needs: prepare_cached_updates
    if: >-
      needs.prepare_cached_updates.outputs.publish == 'true' ||
      needs.prepare_cached_updates.outputs.persist_coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare_cached_updates.outputs.docs_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cached-documentation-queue
          path: ${{ runner.temp }}/cached-artifacts
      - name: Mint existing documentation-only token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: Flow-Steward
          repositories: documentation-site
          permission-contents: write
          permission-pull-requests: write
      - name: Persist completed coverage or propose complete cached changes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/automation/run.mjs publish-cache-only "$RUNNER_TEMP/cached-artifacts/cached-docs-queue"
