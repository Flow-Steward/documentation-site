name: Propose product documentation updates
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [product-docs-sync]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Operational reconciliation only; skip test suites and PR CI for this run'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: product-documentation-sync
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'Flow-Steward/documentation-site' &&
      ((github.event_name == 'repository_dispatch' && github.actor == vars.DOCS_SYNC_ACTOR) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.context.outputs.source_sha }}
      docs_sha: ${{ steps.context.outputs.docs_sha }}
      needed: ${{ steps.context.outputs.needed }}
      tasks: ${{ steps.context.outputs.tasks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: docs-site
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Flow-Steward/flow-steward-app
          ref: main
          fetch-depth: 0
          path: product
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve cumulative source context
        id: context
        working-directory: docs-site
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests && 'true' || 'false' }}
        run: |
          mkdir -p "$RUNNER_TEMP/automation-context"
          node scripts/automation/run.mjs prepare ../product "$RUNNER_TEMP/automation-context/metadata.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-docs-context
          path: ${{ runner.temp }}/automation-context/
          retention-days: 7
          if-no-files-found: error
  generate:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task: ${{ fromJSON(needs.prepare.outputs.tasks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.docs_sha }}
          path: docs-site
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Flow-Steward/flow-steward-app
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-docs-context
          path: automation-context
      - name: Select one planned documentation page
        working-directory: docs-site
        env:
          REVIEW_TASK: ${{ matrix.task }}
        run: node scripts/automation/run.mjs select-task "$REVIEW_TASK" ../automation-context/metadata.json
      - name: Generate a read-only documentation proposal
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.166.0'
          model: ${{ vars.DOCS_AI_MODEL }}
          working-directory: ${{ github.workspace }}/docs-site
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bot-users: ${{ vars.DOCS_SYNC_ACTOR }}
          prompt-file: ${{ github.workspace }}/docs-site/.github/codex/documentation.md
          output-schema-file: ${{ github.workspace }}/docs-site/.github/codex/proposal.schema.json
          output-file: ${{ runner.temp }}/proposal-${{ matrix.task }}.json
      - name: Reject incomplete or failed page review
        working-directory: docs-site
        env:
          REVIEW_TASK: ${{ matrix.task }}
        run: node scripts/automation/run.mjs check-part "$RUNNER_TEMP/proposal-$REVIEW_TASK.json" ../automation-context/metadata.json ../product "$REVIEW_TASK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-proposal-${{ matrix.task }}
          path: ${{ runner.temp }}/proposal-${{ matrix.task }}.json
          retention-days: 7
          if-no-files-found: error
  validate:
    needs: [prepare, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.docs_sha }}
          path: docs-site
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Flow-Steward/flow-steward-app
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-docs-context
          path: ${{ runner.temp }}/context
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docs-proposal-page-*
          merge-multiple: true
          path: ${{ runner.temp }}/proposal
      - name: Require complete coverage before combining proposals
        run: node scripts/automation/run.mjs combine "$RUNNER_TEMP/proposal" "$RUNNER_TEMP/context/metadata.json" ../product
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: node --test scripts/automation/*.test.mjs
      - name: Validate and apply proposed Markdown files
        run: node scripts/automation/run.mjs apply "$RUNNER_TEMP/proposal/combined.json" "$RUNNER_TEMP/context/metadata.json"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE_URL: https://docs.flowsteward.org
          BASE_URL: /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-proposal-combined
          path: ${{ runner.temp }}/proposal/combined.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.docs_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-docs-context
          path: ${{ runner.temp }}/context
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-proposal-combined
          path: ${{ runner.temp }}/proposal
      - name: Mint documentation-only PR token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: Flow-Steward
          repositories: documentation-site
          permission-contents: write
          permission-pull-requests: write
      - name: Open or refresh reviewed documentation PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/automation/run.mjs publish "$RUNNER_TEMP/proposal/combined.json" "$RUNNER_TEMP/context/metadata.json"
